name: Build unsigned IPA

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build libopus (static, iOS arm64)
        run: |
          curl -sL -o /tmp/opus.tar.gz "https://archive.mozilla.org/pub/opus/opus-1.5.2.tar.gz"
          tar xzf /tmp/opus.tar.gz -C /tmp
          cd /tmp/opus-1.5.2
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          echo "SDK: $SDK_PATH"
          ./configure --host=aarch64-apple-darwin \
            --disable-shared --enable-static \
            --disable-doc --disable-extra-programs \
            --prefix=/tmp/opus-install \
            CC=clang \
            CFLAGS="-arch arm64 -miphoneos-version-min=17.6 -isysroot $SDK_PATH -O2" \
            CPPFLAGS="-isysroot $SDK_PATH"
          make -j$(sysctl -n hw.ncpu)
          make install
          ls -lh /tmp/opus-install/lib/libopus.a
          ls /tmp/opus-install/include/opus/

      - name: Patch Swift concurrency errors + switch to static opus
        run: |
          python3 - <<'PYEOF'
          # Patch 1: AudioService 不需要绑 MainActor（AVAudioEngine 线程安全），去掉它消除 9 处报错
          path = 'xiaozhi/AudioService.swift'
          with open(path) as f:
              content = f.read()
          old = '@MainActor\nclass AudioService {'
          assert old in content, "@MainActor class AudioService not found"
          content = content.replace(old, 'class AudioService {', 1)
          # Patch 1b: 去掉 import YbridOpus（改用 bridging header 引入静态 libopus）
          old_import = 'import YbridOpus\n'
          assert old_import in content, "import YbridOpus not found"
          content = content.replace(old_import, '', 1)
          with open(path, 'w') as f:
              f.write(content)
          print("Patch 1: removed @MainActor from AudioService, removed import YbridOpus")

          # Patch 1d: 修复 AppConfigService 的必崩 bug：URL(string: "")! 强制解包 nil
          # 上游 configURL 是空字符串，单例初始化时直接 fatal error，导致启动秒退
          path = 'xiaozhi/AppConfigService.swift'
          with open(path) as f:
              content = f.read()
          old_url = 'private let configURL = URL(string: "")!'
          assert old_url in content, "empty configURL not found"
          content = content.replace(old_url, 'private let configURL = URL(string: "https://example.com")! // fixed: empty string URL crashes on force-unwrap', 1)
          with open(path, 'w') as f:
              f.write(content)
          print("Patch 1d: fixed AppConfigService empty URL force-unwrap crash")

          # Patch 1c: bridging header 引入 opus.h（静态库头文件）
          bh_path = 'xiaozhi/xiaozhi-Bridging-Header.h'
          with open(bh_path) as f:
              bh = f.read()
          assert '#include <opus/opus.h>' not in bh, "opus.h already in bridging header"
          old_guard = '#endif /* xiaozhi_Bridging_Header_h */'
          assert old_guard in bh, "bridging header guard not found"
          bh = bh.replace(old_guard, '// Opus (static lib, built from source)\n#include <opus/opus.h>\n\n' + old_guard, 1)
          with open(bh_path, 'w') as f:
              f.write(bh)
          print("Patch 1c: added #include <opus/opus.h> to bridging header")

          # Patch 2 & 3: 包裹 ChatViewModel 自身 @MainActor 方法的跨线程调用
          path = 'xiaozhi/ChatViewModel.swift'
          with open(path) as f:
              lines = f.readlines()
          tgt = None
          for i, l in enumerate(lines):
              if 'self.speakLocally(text: "页面已生成。")' in l:
                  tgt = i
                  break
          assert tgt is not None, "speakLocally call not found"
          indent = lines[tgt][:len(lines[tgt]) - len(lines[tgt].lstrip())]
          lines[tgt] = indent + 'Task { @MainActor in self.speakLocally(text: "页面已生成。") }\n'
          print(f"Patch 2: wrapped speakLocally at line {tgt+1}")
          tgt = None
          for i, l in enumerate(lines):
              if 'if isHandsFreeMode { pauseAutoListeningForAI() }' in l:
                  tgt = i
                  break
          assert tgt is not None, "pauseAutoListeningForAI call not found"
          indent = lines[tgt][:len(lines[tgt]) - len(lines[tgt].lstrip())]
          lines[tgt] = indent + 'if isHandsFreeMode { Task { @MainActor in pauseAutoListeningForAI() } }\n'
          print(f"Patch 3: wrapped pauseAutoListeningForAI at line {tgt+1}")
          with open(path, 'w') as f:
              f.writelines(lines)
          print("All patches applied")
          PYEOF

      - name: Remove YbridOpus.xcframework from project
        run: |
          # 删除 pbxproj 里所有 YbridOpus 引用（link phase / embed phase / file reference）
          for id in 9B2ECFF92EC898F90082B028 9B2ECFFA2EC898F90082B028 9B2ECFF82EC898F90082B028; do
            sed -i '' "/$id/d" xiaozhi.xcodeproj/project.pbxproj
          done
          if grep -q "YbridOpus" xiaozhi.xcodeproj/project.pbxproj; then
            echo "ERROR: YbridOpus still referenced in pbxproj"
            grep -n "YbridOpus" xiaozhi.xcodeproj/project.pbxproj
            exit 1
          fi
          echo "YbridOpus fully removed from pbxproj"

      - name: Generate shared scheme
        run: |
          mkdir -p xiaozhi.xcodeproj/xcshareddata/xcschemes
          TARGET_ID=$(grep -B1 'isa = PBXNativeTarget' xiaozhi.xcodeproj/project.pbxproj | head -1 | awk '{print $1}')
          echo "Target ID: $TARGET_ID"
          cat > xiaozhi.xcodeproj/xcshareddata/xcschemes/xiaozhi.xcscheme <<SCHEME_EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <Scheme LastUpgradeVersion="1600" version="1.7">
            <BuildAction parallelizeBuildables="YES" buildImplicitDependencies="YES">
              <BuildActionEntries>
                <BuildActionEntry buildForTesting="YES" buildForRunning="YES" buildForProfiling="YES" buildForArchiving="YES" buildForAnalyzing="YES">
                  <BuildableReference BuildableIdentifier="primary" BlueprintIdentifier="$TARGET_ID" BuildableName="xiaozhi.app" BlueprintName="xiaozhi" ReferencedContainer="container:xiaozhi.xcodeproj">
                  </BuildableReference>
                </BuildActionEntry>
              </BuildActionEntries>
            </BuildAction>
            <TestAction buildConfiguration="Debug" selectedDebuggerIdentifier="Xcode.DebuggerFoundation.Debugger.LLDB" selectedLauncherIdentifier="Xcode.DebuggerFoundation.Launcher.LLDB" shouldUseLaunchSchemeArgsEnv="YES">
              <Testables>
              </Testables>
            </TestAction>
            <LaunchAction buildConfiguration="Release" selectedDebuggerIdentifier="Xcode.DebuggerFoundation.Debugger.LLDB" selectedLauncherIdentifier="Xcode.DebuggerFoundation.Launcher.LLDB" launchStyle="0" useCustomWorkingDirectory="NO" ignoresPersistentStateOnLaunch="NO" debugDocumentVersioning="YES" debugServiceExtension="internal" allowLocationSimulation="YES">
            </LaunchAction>
            <ProfileAction buildConfiguration="Release" shouldUseLaunchSchemeArgsEnv="YES" savedToolIdentifier="" useCustomWorkingDirectory="NO" debugDocumentVersioning="YES">
            </ProfileAction>
            <AnalyzeAction buildConfiguration="Debug">
            </AnalyzeAction>
            <ArchiveAction buildConfiguration="Release" revealArchiveInOrganizer="YES">
            </ArchiveAction>
          </Scheme>
          SCHEME_EOF
          ls -la xiaozhi.xcodeproj/xcshareddata/xcs