name: Build unsigned IPA

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build libopus (static, iOS arm64)
        run: |
          curl -sL -o /tmp/opus.tar.gz "https://github.com/xiph/opus/releases/download/v1.5.2/opus-1.5.2.tar.gz"
          file /tmp/opus.tar.gz | grep -q "gzip" || { echo "ERROR: opus tarball download failed"; cat /tmp/opus.tar.gz; exit 1; }
          tar xzf /tmp/opus.tar.gz -C /tmp
          cd /tmp/opus-1.5.2
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          echo "SDK: $SDK_PATH"
          ./configure --host=aarch64-apple-darwin \
            --disable-shared --enable-static \
            --disable-doc --disable-extra-programs \
            --prefix=/tmp/opus-install \
            CC=clang \
            CFLAGS="-arch arm64 -miphoneos-version-min=17.6 -isysroot $SDK_PATH -O2" \
            CPPFLAGS="-isysroot $SDK_PATH"
          make -j$(sysctl -n hw.ncpu)
          make install
          ls -lh /tmp/opus-install/lib/libopus.a
          ls /tmp/opus-install/include/opus/

      - name: Patch Swift concurrency errors + switch to static opus
        run: |
          python3 - <<'PYEOF'
          # 所有补丁都是幂等的：已打过就跳过，找不到目标就警告不断言，保证 Lu 自己改代码不撞车
          def patch_file(path, old, new, desc):
              with open(path) as f:
                  content = f.read()
              if old not in content:
                  # old 已不存在：要么已打过补丁，要么 Lu 自己改掉了，都跳过
                  print(f"SKIP {desc}: target not found (already patched or modified)")
                  return
              content = content.replace(old, new, 1)
              with open(path, 'w') as f:
                  f.write(content)
              print(f"OK {desc}")

          # Patch 1: AudioService 去掉 @MainActor
          patch_file('xiaozhi/AudioService.swift',
                     '@MainActor\nclass AudioService {',
                     'class AudioService {',
                     "remove @MainActor from AudioService")
          # Patch 1b: 去掉 import YbridOpus
          patch_file('xiaozhi/AudioService.swift',
                     'import YbridOpus\n', '',
                     "remove import YbridOpus")
          # Patch 1d: 修复 AppConfigService 空 URL 必崩
          patch_file('xiaozhi/AppConfigService.swift',
                     'private let configURL = URL(string: "")!',
                     'private let configURL = URL(string: "https://example.com")! // fixed: empty string URL crashes on force-unwrap',
                     "fix AppConfigService empty URL crash")
          # Patch 1c: bridging header 引入 opus.h
          patch_file('xiaozhi/xiaozhi-Bridging-Header.h',
                     '#endif /* xiaozhi_Bridging_Header_h */',
                     '// Opus (static lib, built from source)\n#include <opus/opus.h>\n\n#endif /* xiaozhi_Bridging_Header_h */',
                     "add opus.h to bridging header")

          # Patch 2 & 3: 包裹 ChatViewModel 跨线程调用（按行处理，已包过的跳过）
          path = 'xiaozhi/ChatViewModel.swift'
          with open(path) as f:
              lines = f.readlines()
          changed = False
          for i, l in enumerate(lines):
              stripped = l.strip()
              if stripped == 'self.speakLocally(text: "页面已生成。")':
                  indent = l[:len(l) - len(l.lstrip())]
                  lines[i] = indent + 'Task { @MainActor in self.speakLocally(text: "页面已生成。") }\n'
                  changed = True
                  print(f"OK wrapped speakLocally at line {i+1}")
              elif stripped == 'if isHandsFreeMode { pauseAutoListeningForAI() }':
                  indent = l[:len(l) - len(l.lstrip())]
                  lines[i] = indent + 'if isHandsFreeMode { Task { @MainActor in pauseAutoListeningForAI() } }\n'
                  changed = True
                  print(f"OK wrapped pauseAutoListeningForAI at line {i+1}")
          if changed:
              with open(path, 'w') as f:
                  f.writelines(lines)
          else:
              print("SKIP ChatViewModel patches: already patched or not found")

          # Patch 4: 锁屏页"实时对话"按钮旁加绿色通话按钮，直达 HandsFreeLive2DView
          # 注意：YAML literal block 要求所有行缩进足够，故多行字符串用 \n 拼接，避免三引号低缩进破坏 YAML
          path = 'xiaozhi/LockScreenView.swift'
          with open(path) as f:
              content = f.read()
          if 'CallEntryButton' in content:
              print("SKIP Patch 4: CallEntryButton already exists")
          else:
              import textwrap
              # 4a: 注入 EnvironmentObject
              old_state = '    @StateObject var batteryVM = BatteryViewModel()\n'
              assert old_state in content, "batteryVM state not found"
              content = content.replace(old_state,
                  old_state + '    @EnvironmentObject var chatVM: ChatViewModel\n', 1)
              # 4b: 在实时对话按钮前加通话按钮（用显式 \n 拼接，保留 Swift 原文 24 格缩进）
              old_link = ('                        // 2️⃣ 修改：替换原来的 CircularProgressView 为 NavigationLink\n'
                        '                        NavigationLink(destination: ContentView()) {\n'
                        '                            ChatEntryButton() // 抽取出来的按钮样式\n'
                        '                        }')
              assert old_link in content, "ChatEntryButton link not found"
              new_link = ('                        // 通话按钮：直达免提 Live2D 语音通话\n'
                        '                        NavigationLink(destination: HandsFreeLive2DView(chatVM: chatVM)) {\n'
                        '                            CallEntryButton()\n'
                        '                        }\n'
                        '                        .padding(.trailing, 12)\n'
                        '\n'
                        '                        // 2️⃣ 修改：替换原来的 CircularProgressView 为 NavigationLink\n'
                        '                        NavigationLink(destination: ContentView()) {\n'
                        '                            ChatEntryButton() // 抽取出来的按钮样式\n'
                        '                        }')
              content = content.replace(old_link, new_link, 1)
              # 4c: 在 ChatEntryButton 结构体后追加 CallEntryButton
              # Swift 原文缩进为 8/8/4/0，YAML 要求每行 ≥10 格，故统一加 14 格前缀，dedent 还原
              old_struct_end = textwrap.dedent('''\
                      // 添加点击时的按压效果
                      .contentShape(Circle())
                  }
              }''')
              assert old_struct_end in content, "ChatEntryButton struct end not found"
              call_button = textwrap.dedent('''\

                  struct CallEntryButton: View {
                      var body: some View {
                          ZStack {
                              Circle()
                                  .stroke(Color.white.opacity(0.3), lineWidth: 2)
                                  .frame(width: 45, height: 45)
                              Circle()
                                  .trim(from: 0, to: 0.7)
                                  .stroke(Color.green, style: StrokeStyle(lineWidth: 2, lineCap: .round))
                                  .rotationEffect(.degrees(-90))
                                  .frame(width: 45, height: 45)
                              VStack(spacing: 2) {
                                  Image(systemName: "phone.fill")
                                      .font(.system(size: 14))
                                  Text("语音通话")
                                      .font(.system(size: 8, weight: .bold))
                              }
                              .foregroundColor(.white)
                          }
                          .contentShape(Circle())
                      }
                  }''')
              content = content.replace(old_struct_end, old_struct_end + call_button, 1)
              with open(path, 'w') as f:
                  f.write(content)
              print("OK Patch 4: added CallEntryButton next to 实时对话")

          # Patch 4d: 移除 ContentView 顶部旧的绿色通话按钮（已移到锁屏页；齿轮/调试入口保留）
          path = 'xiaozhi/ContentView.swift'
          with open(path) as f:
              lines = f.readlines()
          target = None
          for i, l in enumerate(lines):
              if 'phone.circle.fill' in l:
                  target = i
                  break
          if target is None:
              print("SKIP Patch 4d: old call button not found (already removed)")
          else:
              start = target
              for j in range(target, max(-1, target-6), -1):
                  if 'NavigationLink' in lines[j] and 'HandsFreeLive2DView' in lines[j]:
                      start = j
                      break
              if start > 0 and '免提模式入口' in lines[start-1]:
                  start -= 1
              depth = 0
              end = None
              for j in range(start, len(lines)):
                  depth += lines[j].count('{') - lines[j].count('}')
                  if depth == 0 and j > start:
                      end = j
                      break
              if end is None:
                  print("WARN Patch 4d: block end not found, skipped")
              else:
                  del lines[start:end+1]
                  with open(path, 'w') as f:
                      f.writelines(lines)
                  print(f"OK Patch 4d: removed old call button (lines {start+1}-{end+1})")
          print("All patches done (idempotent)")
          PYEOF


      - name: Patch 5-6 Text chat view files
        run: |
          python3 - <<'PYEOF'
          import base64, os
          # Patch 5: ChatViewModel.sendTextMessage
          path = 'xiaozhi/ChatViewModel.swift'
          with open(path) as f: content = f.read()
          if 'func sendTextMessage(text:' in content:
              print("SKIP Patch 5: already exists")
          else:
              anchor = '    func mcpDidRequestSendFakeUserMessage(text: String) {'
              assert anchor in content
              old_b = anchor + "\n        guard let sid = currentSessionId else { return }\n        sendJson([\"session_id\": sid, \"type\": \"text\", \"text\": text])\n    }"
              new_b = old_b + "\n\n    // Patch 5: text chat send\n    func sendTextMessage(text: String) {\n        guard let sid = currentSessionId else { return }\n        let m = ChatMessage(text: text, type: .sent)\n        DispatchQueue.main.async { self.messageList.append(m) }\n        sendJson([\"session_id\": sid, \"type\": \"text\", \"text\": text])\n    }"
              content = content.replace(old_b, new_b, 1)
              with open(path, 'w') as f: f.write(content)
              print("OK Patch 5")
          # Patch 6: TextChatView.swift from base64
          if os.path.exists('xiaozhi/TextChatView.swift'):
              print("SKIP Patch 6: exists")
          else:
              b64 = ""
              with open('xiaozhi/TextChatView.swift', 'wb') as f: f.write(base64.b64decode(b64))
              print("OK Patch 6: TextChatView.swift")
          # Patch 7: URL scheme
          import plistlib
          pp = 'xiaozhi/Info.plist'
          with open(pp, 'rb') as f: pl = plistlib.load(f)
          uts = pl.get('CFBundleURLTypes', [])
          if not any('xiaozhi' in str(t.get('CFBundleURLSchemes', [])) for t in uts):
              uts.append({'CFBundleURLSchemes': ['xiaozhi'], 'CFBundleURLName': 'com.lu6618.xiaozhi'})
              pl['CFBundleURLTypes'] = uts
              with open(pp, 'wb') as f: plistlib.dump(pl, f)
              print("OK Patch 7: URL scheme")
          else: print("SKIP Patch 7")
          print("Done 5-7")
          PYEOF

      - name: Patch 8 Deep link handling
        run: |
          python3 - <<'PYEOF'
          path = 'xiaozhi/LockScreenView.swift'
          with open(path) as f: c = f.read()
          if 'showVoiceCall' in c:
              print("SKIP Patch 8")
          else:
              old_env = '    @EnvironmentObject var chatVM: ChatViewModel\n'
              assert old_env in c
              c = c.replace(old_env, old_env + '    @State private var showVoiceCall = false\n    @State private var showTextChat = false\n', 1)
              old_r = '            .onReceive(timer) { input in\n                currentDate = input\n            }\n        }'
              assert old_r in c, "anchor not found"
              new_r = '            .onReceive(timer) { input in\n                currentDate = input\n            }\n            .onOpenURL { url in\n                if url.scheme == "xiaozhi" {\n                    if url.host == "voice" { showVoiceCall = true }\n                    else if url.host == "text" { showTextChat = true }\n                }\n            }\n            .fullScreenCover(isPresented: $showVoiceCall) {\n                HandsFreeLive2DView(chatVM: chatVM)\n            }\n            .fullScreenCover(isPresented: $showTextChat) {\n                NavigationStack {\n                    TextChatView().environmentObject(chatVM)\n                }\n            }\n        }'
              c = c.replace(old_r, new_r, 1)
              with open(path, 'w') as f: f.write(c)
              print("OK Patch 8: deep links")
          PYEOF

      - name: Patch 9 Widget extension
        run: |
          python3 - <<'PYEOF'
          import base64, os, uuid
          os.makedirs('XiaozhiWidget', exist_ok=True)
          if not os.path.exists('XiaozhiWidget/XiaozhiWidgets.swift'):
              b64 = ""
              with open('XiaozhiWidget/XiaozhiWidgets.swift', 'wb') as f: f.write(base64.b64decode(b64))
              print("OK 9a")
          else: print("SKIP 9a")
          if not os.path.exists('XiaozhiWidget/WidgetInfo.plist'):
              b64 = ""
              with open('XiaozhiWidget/WidgetInfo.plist', 'wb') as f: f.write(base64.b64decode(b64))
              print("OK 9b")
          else: print("SKIP 9b")
          PBX = "xiaozhi.xcodeproj/project.pbxproj"
          with open(PBX) as f: content = f.read()
          if 'XiaozhiWidgetExtension' in content:
              print("SKIP 9c")
          else:
              def gu():
                  return uuid.uuid4().hex[:24].upper()
              tid = gu(); pr = gu(); sp = gu(); fp = gu(); rp = gu()
              bf = gu(); fr_sw = gu(); fr_pl = gu(); cl = gu(); cd = gu(); cr = gu()
              TN = "XiaozhiWidgetExtension"; BID = "com.lu6618.xiaozhi.widget"
              TAB = "\t"
              # 使用字符串拼接，避免 f-string
              fr = TAB+TAB+pr+" /* "+TN+".appex */ = {isa = PBXFileReference; explicitFileType = \"wrapper.app-extension\"; includeInIndex = 0; path = \""+TN+".appex\"; sourceTree = BUILT_PRODUCTS_DIR; };\n"
              fr += TAB+TAB+fr_sw+" /* XiaozhiWidgets.swift */ = {isa = PBXFileReference; lastKnownFileType = sourcecode.swift; path = \"XiaozhiWidget/XiaozhiWidgets.swift\"; sourceTree = SOURCE_ROOT; };\n"
              fr += TAB+TAB+fr_pl+" /* WidgetInfo.plist */ = {isa = PBXFileReference; lastKnownFileType = text.plist.xml; path = \"XiaozhiWidget/WidgetInfo.plist\"; sourceTree = SOURCE_ROOT; };\n"
              content = content.replace("/* End PBXFileReference section */", fr + "/* End PBXFileReference section */", 1)
              bfile = TAB+TAB+bf+" /* XiaozhiWidgets.swift in Sources */ = {isa = PBXBuildFile; fileRef = "+fr_sw+" /* XiaozhiWidgets.swift */; };\n"
              content = content.replace("/* End PBXBuildFile section */", bfile + "/* End PBXBuildFile section */", 1)
              # Sources phase
              sph = TAB+TAB+sp+" /* Sources */ = {\n"+TAB+TAB+TAB+"isa = PBXSourcesBuildPhase;\n"+TAB+TAB+TAB+"buildActionMask = 2147483647;\n"+TAB+TAB+TAB+"files = (\n"+TAB+TAB+TAB+TAB+bf+" /* XiaozhiWidgets.swift in Sources */,\n"+TAB+TAB+TAB+");\n"+TAB+TAB+TAB+"runOnlyForDeploymentPostprocessing = 0;\n"+TAB+TAB+"};\n"
              content = content.replace("/* End PBXSourcesBuildPhase section */", sph + "/* End PBXSourcesBuildPhase section */", 1)
              # Frameworks phase
              fph = TAB+TAB+fp+" /* Frameworks */ = {\n"+TAB+TAB+TAB+"isa = PBXFrameworksBuildPhase;\n"+TAB+TAB+TAB+"buildActionMask = 2147483647;\n"+TAB+TAB+TAB+"files = (\n"+TAB+TAB+TAB+");\n"+TAB+TAB+TAB+"runOnlyForDeploymentPostprocessing = 0;\n"+TAB+TAB+"};\n"
              content = content.replace("/* End PBXFrameworksBuildPhase section */", fph + "/* End PBXFrameworksBuildPhase section */", 1)
              # Resources phase
              rph = TAB+TAB+rp+" /* Resources */ = {\n"+TAB+TAB+TAB+"isa = PBXResourcesBuildPhase;\n"+TAB+TAB+TAB+"buildActionMask = 2147483647;\n"+TAB+TAB+TAB+"files = (\n"+TAB+TAB+TAB+");\n"+TAB+TAB+TAB+"runOnlyForDeploymentPostprocessing = 0;\n"+TAB+TAB+"};\n"
              content = content.replace("/* End PBXResourcesBuildPhase section */", rph + "/* End PBXResourcesBuildPhase section */", 1)
              # Target
              tgt = TAB+TAB+tid+" /* "+TN+" */ = {\n"+TAB+TAB+TAB+"isa = PBXNativeTarget;\n"+TAB+TAB+TAB+"buildConfigurationList = "+cl+";\n"+TAB+TAB+TAB+"buildPhases = (\n"+TAB+TAB+TAB+TAB+sp+" /* Sources */,\n"+TAB+TAB+TAB+TAB+fp+" /* Frameworks */,\n"+TAB+TAB+TAB+TAB+rp+" /* Resources */,\n"+TAB+TAB+TAB+");\n"+TAB+TAB+TAB+"buildRules = (\n"+TAB+TAB+TAB+");\n"+TAB+TAB+TAB+"dependencies = (\n"+TAB+TAB+TAB+");\n"+TAB+TAB+TAB+"name = "+TN+";\n"+TAB+TAB+TAB+"productName = "+TN+";\n"+TAB+TAB+TAB+"productReference = "+pr+";\n"+TAB+TAB+TAB+"productType = \"com.apple.product-type.app-extension\";\n"+TAB+TAB+"};\n"
              content = content.replace("/* End PBXNativeTarget section */", tgt + "/* End PBXNativeTarget section */", 1)
              # Build configs
              cfg = TAB+TAB+cd+" /* Debug */ = {\n"+TAB+TAB+TAB+"isa = XCBuildConfiguration;\n"+TAB+TAB+TAB+"buildSettings = {\n"+TAB+TAB+TAB+TAB+"INFOPLIST_FILE = \"XiaozhiWidget/WidgetInfo.plist\";\n"+TAB+TAB+TAB+TAB+"IPHONEOS_DEPLOYMENT_TARGET = 17.6;\n"+TAB+TAB+TAB+TAB+"PRODUCT_BUNDLE_IDENTIFIER = \""+BID+"\";\n"+TAB+TAB+TAB+TAB+"SWIFT_VERSION = 5.0;\n"+TAB+TAB+TAB+TAB+"SKIP_INSTALL = YES;\n"+TAB+TAB+TAB+TAB+"CODE_SIGNING_ALLOWED = NO;\n"+TAB+TAB+TAB+"};\n"+TAB+TAB+TAB+"name = Debug;\n"+TAB+TAB+"};\n"
              cfg += TAB+TAB+cr+" /* Release */ = {\n"+TAB+TAB+TAB+"isa = XCBuildConfiguration;\n"+TAB+TAB+TAB+"buildSettings = {\n"+TAB+TAB+TAB+TAB+"INFOPLIST_FILE = \"XiaozhiWidget/WidgetInfo.plist\";\n"+TAB+TAB+TAB+TAB+"IPHONEOS_DEPLOYMENT_TARGET = 17.6;\n"+TAB+TAB+TAB+TAB+"PRODUCT_BUNDLE_IDENTIFIER = \""+BID+"\";\n"+TAB+TAB+TAB+TAB+"SWIFT_VERSION = 5.0;\n"+TAB+TAB+TAB+TAB+"SKIP_INSTALL = YES;\n"+TAB+TAB+TAB+TAB+"CODE_SIGNING_ALLOWED = NO;\n"+TAB+TAB+TAB+"};\n"+TAB+TAB+TAB+"name = Release;\n"+TAB+TAB+"};\n"
              content = content.replace("/* End XCBuildConfiguration section */", cfg + "/* End XCBuildConfiguration section */", 1)
              clist = TAB+TAB+cl+" /* Build configuration list */ = {\n"+TAB+TAB+TAB+"isa = XCConfigurationList;\n"+TAB+TAB+TAB+"buildConfigurations = (\n"+TAB+TAB+TAB+TAB+cd+" /* Debug */,\n"+TAB+TAB+TAB+TAB+cr+" /* Release */,\n"+TAB+TAB+TAB+");\n"+TAB+TAB+TAB+"defaultConfigurationIsVisible = 0;\n"+TAB+TAB+TAB+"defaultConfigurationName = Release;\n"+TAB+TAB+"};\n"
              content = content.replace("/* End XCConfigurationList section */", clist + "/* End XCConfigurationList section */", 1)
              # Add to targets
              content = content.replace("9B2ECFD02EC86CCA0082B028 /* xiaozhi */,\n\t\t\t);", "9B2ECFD02EC86CCA0082B028 /* xiaozhi */,\n\t\t\t\t"+tid+" /* "+TN+" */,\n\t\t\t);", 1)
              with open(PBX, "w") as f: f.write(content)
              print("OK 9c: "+tid)
          print("Done 9")
          PYEOF

      - name: Remove YbridOpus.xcframework from project
        run: |
          # 删除 pbxproj 里所有 YbridOpus 引用（link phase / embed phase / file reference）
          for id in 9B2ECFF92EC898F90082B028 9B2ECFFA2EC898F90082B028 9B2ECFF82EC898F90082B028; do
            sed -i '' "/$id/d" xiaozhi.xcodeproj/project.pbxproj
          done
          if grep -q "YbridOpus" xiaozhi.xcodeproj/project.pbxproj; then
            echo "ERROR: YbridOpus still referenced in pbxproj"
            grep -n "YbridOpus" xiaozhi.xcodeproj/project.pbxproj
            exit 1
          fi
          echo "YbridOpus fully removed from pbxproj"

      - name: Generate shared scheme
        run: |
          mkdir -p xiaozhi.xcodeproj/xcshareddata/xcschemes
          TARGET_ID=$(grep 'isa = PBXNativeTarget' -B2 xiaozhi.xcodeproj/project.pbxproj | grep -B1 'name = xiaozhi;' | head -1 | awk '{print $1}')
          # 兼容旧格式：如果上面没找到，用老方法
          if [ -z "$TARGET_ID" ]; then
            TARGET_ID=$(grep -B1 'isa = PBXNativeTarget' xiaozhi.xcodeproj/project.pbxproj | head -1 | awk '{print $1}')
          fi
          echo "Main Target ID: $TARGET_ID"
          # 查找 Widget Extension target ID
          WIDGET_ID=$(grep -A2 'XiaozhiWidgetExtension.*isa = PBXNativeTarget' xiaozhi.xcodeproj/project.pbxproj | head -1 | awk '{print $1}')
          if [ -z "$WIDGET_ID" ]; then
            WIDGET_ID=$(grep 'XiaozhiWidgetExtension' xiaozhi.xcodeproj/project.pbxproj | grep 'PBXNativeTarget' | head -1 | awk '{print $1}')
          fi
          # 更可靠：直接找 productType 为 app-extension 的 target
          if [ -z "$WIDGET_ID" ] || [[ "$WIDGET_ID" == "/*" ]]; then
            WIDGET_ID=$(grep -B5 'productType = "com.apple.product-type.app-extension"' xiaozhi.xcodeproj/project.pbxproj | grep -oE '[A-F0-9]{24}' | head -1)
          fi
          echo "Widget Target ID: $WIDGET_ID"
          # 生成包含两个 target 的 scheme（用 printf 避免引号嵌套被 bash 吃掉）
          WIDGET_ENTRY=""
          if [ -n "$WIDGET_ID" ] && [[ "$WIDGET_ID" != "/*" ]]; then
            WIDGET_ENTRY=$(printf '<BuildActionEntry buildForTesting="YES" buildForRunning="YES" buildForProfiling="YES" buildForArchiving="YES" buildForAnalyzing="YES"><BuildableReference BuildableIdentifier="primary" BlueprintIdentifier="%s" BuildableName="XiaozhiWidgetExtension.appex" BlueprintName="XiaozhiWidgetExtension" ReferencedContainer="container:xiaozhi.xcodeproj"></BuildableReference></BuildActionEntry>' "$WIDGET_ID")
          fi
          cat > xiaozhi.xcodeproj/xcshareddata/xcschemes/xiaozhi.xcscheme <<SCHEME_EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <Scheme LastUpgradeVersion="1600" version="1.7">
            <BuildAction parallelizeBuildables="YES" buildImplicitDependencies="YES">
              <BuildActionEntries>
                <BuildActionEntry buildForTesting="YES" buildForRunning="YES" buildForProfiling="YES" buildForArchiving="YES" buildForAnalyzing="YES">
                  <BuildableReference BuildableIdentifier="primary" BlueprintIdentifier="$TARGET_ID" BuildableName="xiaozhi.app" BlueprintName="xiaozhi" ReferencedContainer="container:xiaozhi.xcodeproj">
                  </BuildableReference>
                </BuildActionEntry>
                $WIDGET_ENTRY
              </BuildActionEntries>
            </BuildAction>
            <TestAction buildConfiguration="Debug" selectedDebuggerIdentifier="Xcode.DebuggerFoundation.Debugger.LLDB" selectedLauncherIdentifier="Xcode.DebuggerFoundation.Launcher.LLDB" shouldUseLaunchSchemeArgsEnv="YES">
              <Testables>
              </Testables>
            </TestAction>
            <LaunchAction buildConfiguration="Release" selectedDebuggerIdentifier="Xcode.DebuggerFoundation.Debugger.LLDB" selectedLauncherIdentifier="Xcode.DebuggerFoundation.Launcher.LLDB" launchStyle="0" useCustomWorkingDirectory="NO" ignoresPersistentStateOnLaunch="NO" debugDocumentVersioning="YES" debugServiceExtension="internal" allowLocationSimulation="YES">
            </LaunchAction>
            <ProfileAction buildConfiguration="Release" shouldUseLaunchSchemeArgsEnv="YES" savedToolIdentifier="" useCustomWorkingDirectory="NO" debugDocumentVersioning="YES">
            </ProfileAction>
            <AnalyzeAction buildConfiguration="Debug">
            </AnalyzeAction>
            <ArchiveAction buildConfiguration="Release" revealArchiveInOrganizer="YES">
            </ArchiveAction>
          </Scheme>
          SCHEME_EOF
          ls -la xiaozhi.xcodeproj/xcshareddata/xcschemes/

      - name: Set display name
        run: |
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName 小智" xiaozhi/Info.plist
          /usr/libexec/PlistBuddy -c "Print :CFBundleDisplayName" xiaozhi/Info.plist

      - name: Archive (unsigned, static opus)
        run: |
          xcodebuild -project xiaozhi.xcodeproj \
            -scheme xiaozhi \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/xiaozhi.xcarchive \
            PRODUCT_BUNDLE_IDENTIFIER=com.lu6618.xiaozhi \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            SWIFT_STRICT_CONCURRENCY=minimal \
            HEADER_SEARCH_PATHS='$(inherited) /tmp/opus-install/include' \
            LIBRARY_SEARCH_PATHS='$(inherited) /tmp/opus-install/lib' \
            OTHER_LDFLAGS='$(inherited) -lopus' \
            archive

      - name: Verify no embedded frameworks
        run: |
          APP_PATH=$(find build/xiaozhi.xcarchive/Products/Applications -maxdepth 1 -name "*.app" | head -1)
          echo "App: $APP_PATH"
          if [ -d "$APP_PATH/Frameworks" ]; then
            echo "WARNING: Frameworks dir exists:"
            ls -la "$APP_PATH/Frameworks/"
          else
            echo "OK: no Frameworks directory (all static)"
          fi
          ls -la "$APP_PATH" | head -20

      - name: Package unsigned IPA
        run: |
          APP_PATH=$(find build/xiaozhi.xcarchive/Products/Applications -maxdepth 1 -name "*.app" | head -1)
          rm -rf Payload && mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          # 确保 Widget Extension 已嵌入（如果 scheme 构建未自动嵌入，手动复制）
          APPEX_SRC=$(find build/xiaozhi.xcarchive -name "XiaozhiWidgetExtension.appex" -type d | head -1)
          if [ -n "$APPEX_SRC" ]; then
            echo "Found widget appex: $APPEX_SRC"
            mkdir -p "Payload/$(basename $APP_PATH)/PlugIns"
            # 如果还没有嵌入，则复制
            if [ ! -d "Payload/$(basename $APP_PATH)/PlugIns/XiaozhiWidgetExtension.appex" ]; then
              cp -R "$APPEX_SRC" "Payload/$(basename $APP_PATH)/PlugIns/"
              echo "Copied widget to PlugIns/"
            else
              echo "Widget already embedded"
            fi
            ls -la "Payload/$(basename $APP_PATH)/PlugIns/"
          else
            echo "WARNING: Widget appex not found in archive"
          fi
          rm -f xiaozhi-ios-unsigned.ipa
          zip -qr xiaozhi-ios-unsigned.ipa Payload
          ls -la xiaozhi-ios-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: xiaozhi-ios-unsigned
          path: xiaozhi-ios-unsigned.ipa
          if-no-files-found: error

      - name: Publish to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="unsigned-${{ github.run_number }}"
          gh release create "$TAG" \
            --title "Unsigned IPA #$TAG" \
            --notes "未签名 IPA，下载后自签安装。" \
            xiaozhi-ios-unsigned.ipa