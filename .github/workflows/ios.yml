name: Build iOS IPA

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish the IPA to GitHub Releases
        required: false
        default: false
        type: boolean
  push:
    branches: [main]
    paths:
      - "xiaozhi/**"
      - "xiaozhi.xcodeproj/**"
      - "Asset/**"
      - "Core/**"
      - "Framework/**"
      - "Metal/**"
      - "Media.xcassets/**"
      - "Launch Screen.storyboard"
      - ".github/workflows/ios.yml"

permissions:
  contents: write

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build unsigned IPA
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show toolchain
        run: xcodebuild -version

      - name: Build Opus for iOS arm64
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --output /tmp/opus.tar.gz \
            https://github.com/xiph/opus/releases/download/v1.5.2/opus-1.5.2.tar.gz
          tar -xzf /tmp/opus.tar.gz -C /tmp
          cd /tmp/opus-1.5.2
          SDK_PATH="$(xcrun --sdk iphoneos --show-sdk-path)"
          ./configure --host=aarch64-apple-darwin --disable-shared --enable-static \
            --disable-doc --disable-extra-programs --prefix=/tmp/opus-install \
            CC="$(xcrun --find clang)" \
            CFLAGS="-arch arm64 -miphoneos-version-min=17.6 -isysroot ${SDK_PATH} -O2" \
            CPPFLAGS="-isysroot ${SDK_PATH}"
          make -j"$(sysctl -n hw.ncpu)"
          make install

      - name: Configure CI dependencies
        shell: bash
        run: |
          set -euo pipefail
          # Replace the developer-local YbridOpus framework with static Opus.
          sed -i '' '/9B2ECFF92EC898F90082B028/d' xiaozhi.xcodeproj/project.pbxproj
          sed -i '' '/9B2ECFFA2EC898F90082B028/d' xiaozhi.xcodeproj/project.pbxproj
          sed -i '' '/9B2ECFF82EC898F90082B028/d' xiaozhi.xcodeproj/project.pbxproj
          sed -i '' '/import YbridOpus/d' xiaozhi/AudioService.swift
          python3 - <<'PY'
          from pathlib import Path

          header = Path("xiaozhi/xiaozhi-Bridging-Header.h")
          content = header.read_text()
          marker = "#endif /* xiaozhi_Bridging_Header_h */"
          if "#include <opus/opus.h>" not in content:
              header.write_text(content.replace(marker, "#include <opus/opus.h>\n\n" + marker))

          audio = Path("xiaozhi/AudioService.swift")
          content = audio.read_text().replace("@MainActor\nclass AudioService {", "class AudioService {")
          audio.write_text(content)

          config = Path("xiaozhi/AppConfigService.swift")
          content = config.read_text().replace(
              'private let configURL = URL(string: "")!',
              'private let configURL = URL(string: "https://example.com")!'
          )
          config.write_text(content)

          chat = Path("xiaozhi/ChatViewModel.swift")
          content = chat.read_text()
          content = content.replace(
              'self.speakLocally(text: "页面已生成。")',
              'Task { @MainActor in self.speakLocally(text: "页面已生成。") }'
          )
          content = content.replace(
              'if isHandsFreeMode { pauseAutoListeningForAI() }',
              'if isHandsFreeMode { Task { @MainActor in pauseAutoListeningForAI() } }'
          )
          chat.write_text(content)
          PY

      - name: Generate shared scheme
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p xiaozhi.xcodeproj/xcshareddata/xcschemes
          cat > xiaozhi.xcodeproj/xcshareddata/xcschemes/xiaozhi.xcscheme <<'XML'
          <?xml version="1.0" encoding="UTF-8"?>
          <Scheme LastUpgradeVersion="1600" version="1.7">
            <BuildAction parallelizeBuildables="YES" buildImplicitDependencies="YES">
              <BuildActionEntries>
                <BuildActionEntry buildForTesting="YES" buildForRunning="YES" buildForProfiling="YES" buildForArchiving="YES" buildForAnalyzing="YES">
                  <BuildableReference BuildableIdentifier="primary" BlueprintIdentifier="9B2ECFD02EC86CCA0082B028" BuildableName="xiaozhi.app" BlueprintName="xiaozhi" ReferencedContainer="container:xiaozhi.xcodeproj"/>
                </BuildActionEntry>
              </BuildActionEntries>
            </BuildAction>
            <TestAction buildConfiguration="Debug"/>
            <LaunchAction buildConfiguration="Release"/>
            <ProfileAction buildConfiguration="Release"/>
            <AnalyzeAction buildConfiguration="Debug"/>
            <ArchiveAction buildConfiguration="Release" revealArchiveInOrganizer="YES"/>
          </Scheme>
          XML
          xcodebuild -project xiaozhi.xcodeproj -list

      - name: Archive unsigned app
        shell: bash
        run: |
          set -o pipefail
          xcodebuild -project xiaozhi.xcodeproj -scheme xiaozhi \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath "$PWD/build/xiaozhi.xcarchive" \
            PRODUCT_BUNDLE_IDENTIFIER=com.lu6618.xiaozhi \
            CODE_SIGN_IDENTITY='' CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO \
            SWIFT_STRICT_CONCURRENCY=minimal \
            HEADER_SEARCH_PATHS='$(inherited) /tmp/opus-install/include' \
            LIBRARY_SEARCH_PATHS='$(inherited) /tmp/opus-install/lib' \
            OTHER_LDFLAGS='$(inherited) -lopus' archive | tee build.log

      - name: Package IPA
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH="$(find build/xiaozhi.xcarchive/Products/Applications -maxdepth 1 -name '*.app' -type d | head -1)"
          test -n "$APP_PATH"
          rm -rf Payload
          mkdir Payload
          cp -R "$APP_PATH" Payload/
          ditto -c -k --sequesterRsrc --keepParent Payload xiaozhi-ios-unsigned.ipa
          unzip -t xiaozhi-ios-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: xiaozhi-ios-unsigned-${{ github.run_number }}
          path: xiaozhi-ios-unsigned.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcode-build-log-${{ github.run_number }}
          path: build.log
          if-no-files-found: ignore

      - name: Annotate Swift compiler errors
        if: failure()
        shell: bash
        run: |
          if [ ! -f build.log ]; then exit 0; fi
          grep -E '\.swift:[0-9]+:[0-9]+: error:' build.log | tail -50 | while IFS= read -r line; do
            file=$(printf '%s' "$line" | sed -E 's#^.*(/[^:]+\.swift):([0-9]+):([0-9]+): error:.*#\1#')
            row=$(printf '%s' "$line" | sed -E 's#^.*\.swift:([0-9]+):([0-9]+): error:.*#\1#')
            col=$(printf '%s' "$line" | sed -E 's#^.*\.swift:([0-9]+):([0-9]+): error:.*#\2#')
            message=$(printf '%s' "$line" | sed -E 's#^.* error: ##')
            file=${file#"$GITHUB_WORKSPACE/"}
            echo "::error file=$file,line=$row,col=$col::$message"
          done

      - name: Publish GitHub Release
        if: github.event_name == 'workflow_dispatch' && inputs.publish_release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="unsigned-${{ github.run_number }}"
          gh release create "$TAG" --title "Unsigned IPA #${{ github.run_number }}" \
            --notes "Unsigned IPA built from commit ${{ github.sha }}. Sign it before installing." \
            xiaozhi-ios-unsigned.ipa
