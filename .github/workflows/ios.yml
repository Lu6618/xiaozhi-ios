name: Build unsigned IPA

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build libopus (static, iOS arm64)
        run: |
          curl -sL -o /tmp/opus.tar.gz "https://github.com/xiph/opus/releases/download/v1.5.2/opus-1.5.2.tar.gz"
          file /tmp/opus.tar.gz | grep -q "gzip" || { echo "ERROR: opus tarball download failed"; cat /tmp/opus.tar.gz; exit 1; }
          tar xzf /tmp/opus.tar.gz -C /tmp
          cd /tmp/opus-1.5.2
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          echo "SDK: $SDK_PATH"
          ./configure --host=aarch64-apple-darwin \
            --disable-shared --enable-static \
            --disable-doc --disable-extra-programs \
            --prefix=/tmp/opus-install \
            CC=clang \
            CFLAGS="-arch arm64 -miphoneos-version-min=17.6 -isysroot $SDK_PATH -O2" \
            CPPFLAGS="-isysroot $SDK_PATH"
          make -j$(sysctl -n hw.ncpu)
          make install
          ls -lh /tmp/opus-install/lib/libopus.a
          ls /tmp/opus-install/include/opus/

      - name: Patch Swift concurrency errors + switch to static opus
        run: |
          python3 - <<'PYEOF'
          # 所有补丁都是幂等的：已打过就跳过，找不到目标就警告不断言，保证 Lu 自己改代码不撞车
          def patch_file(path, old, new, desc):
              with open(path) as f:
                  content = f.read()
              if new in content:
                  print(f"SKIP {desc}: already patched")
                  return
              if old not in content:
                  print(f"WARN {desc}: target not found, skipping")
                  return
              content = content.replace(old, new, 1)
              with open(path, 'w') as f:
                  f.write(content)
              print(f"OK {desc}")

          # Patch 1: AudioService 去掉 @MainActor
          patch_file('xiaozhi/AudioService.swift',
                     '@MainActor\nclass AudioService {',
                     'class AudioService {',
                     "remove @MainActor from AudioService")
          # Patch 1b: 去掉 import YbridOpus
          patch_file('xiaozhi/AudioService.swift',
                     'import YbridOpus\n', '',
                     "remove import YbridOpus")
          # Patch 1d: 修复 AppConfigService 空 URL 必崩
          patch_file('xiaozhi/AppConfigService.swift',
                     'private let configURL = URL(string: "")!',
                     'private let configURL = URL(string: "https://example.com")! // fixed: empty string URL crashes on force-unwrap',
                     "fix AppConfigService empty URL crash")
          # Patch 1c: bridging header 引入 opus.h
          patch_file('xiaozhi/xiaozhi-Bridging-Header.h',
                     '#endif /* xiaozhi_Bridging_Header_h */',
                     '// Opus (static lib, built from source)\n#include <opus/opus.h>\n\n#endif /* xiaozhi_Bridging_Header_h */',
                     "add opus.h to bridging header")

          # Patch 2 & 3: 包裹 ChatViewModel 跨线程调用（按行处理，已包过的跳过）
          path = 'xiaozhi/ChatViewModel.swift'
          with open(path) as f:
              lines = f.readlines()
          changed = False
          for i, l in enumerate(lines):
              stripped = l.strip()
              if stripped == 'self.speakLocally(text: "页面已生成。")':
                  indent = l[:len(l) - len(l.lstrip())]
                  lines[i] = indent + 'Task { @MainActor in self.speakLocally(text: "页面已生成。") }\n'
                  changed = True
                  print(f"OK wrapped speakLocally at line {i+1}")
              elif stripped == 'if isHandsFreeMode { pauseAutoListeningForAI() }':
                  indent = l[:len(l) - len(l.lstrip())]
                  lines[i] = indent + 'if isHandsFreeMode { Task { @MainActor in pauseAutoListeningForAI() } }\n'
                  changed = True
                  print(f"OK wrapped pauseAutoListeningForAI at line {i+1}")
          if changed:
              with open(path, 'w') as f:
                  f.writelines(lines)
          else:
              print("SKIP ChatViewModel patches: already patched or not found")

          # Patch 4: 锁屏页"实时对话"按钮旁加绿色通话按钮，直达 HandsFreeLive2DView
          # 注意：YAML literal block 要求所有行缩进足够，故多行字符串用 textwrap.dedent 处理
          path = 'xiaozhi/LockScreenView.swift'
          with open(path) as f:
              content = f.read()
          if 'CallEntryButton' in content:
              print("SKIP Patch 4: CallEntryButton already exists")
          else:
              import textwrap
              # 4a: 注入 EnvironmentObject
              old_state = '    @StateObject var batteryVM = BatteryViewModel()\n'
              assert old_state in content, "batteryVM state not found"
              content = content.replace(old_state,
                  old_state + '    @EnvironmentObject var chatVM: ChatViewModel\n', 1)
              # 4b: 在实时对话按钮前加通话按钮（用显式 \n 拼接，保留 Swift 原文 24 格缩进）
              old_link = ('                        // 2️⃣ 修改：替换原来的 CircularProgressView 为 NavigationLink\n'
                        '                        NavigationLink(destination: ContentView()) {\n'
                        '                            ChatEntryButton() // 抽取出来的按钮样式\n'
                        '                        }')
              assert old_link in content, "ChatEntryButton link not found"
              new_link = ('                        // 通话按钮：直达免提 Live2D 语音通话\n'
                        '                        NavigationLink(destination: HandsFreeLive2DView(chatVM: chatVM)) {\n'
                        '                            CallEntryButton()\n'
                        '                        }\n'
                        '                        .padding(.trailing, 12)\n'
                        '\n'
                        '                        // 2️⃣ 修改：替换原来的 CircularProgressView 为 NavigationLink\n'
                        '                        NavigationLink(destination: ContentView()) {\n'
                        '                            ChatEntryButton() // 抽取出来的按钮样式\n'
                        '                        }')
              content = content.replace(old_link, new_link, 1)
              # 4c: 在 ChatEntryButton 结构体后追加 CallEntryButton
              # Swift 原文缩进为 8/8/4/0，YAML 要求每行 ≥10 格，故统一加 14 格前缀，dedent 还原
              old_struct_end = textwrap.dedent('''\
                      // 添加点击时的按压效果
                      .contentShape(Circle())
                  }
              }''')
              assert old_struct_end in content, "ChatEntryButton struct end not found"
              call_button = textwrap.dedent('''\

                  struct CallEntryButton: View {
                      var body: some View {
                          ZStack {
                              Circle()
                                  .stroke(Color.white.opacity(0.3), lineWidth: 2)
                                  .frame(width: 45, height: 45)
                              Circle()
                                  .trim(from: 0, to: 0.7)
                                  .stroke(Color.green, style: StrokeStyle(lineWidth: 2, lineCap: .round))
                                  .rotationEffect(.degrees(-90))
                                  .frame(width: 45, height: 45)
                              VStack(spacing: 2) {
                                  Image(systemName: "phone.fill")
                                      .font(.system(size: 14))
                                  Text("语音通话")
                                      .font(.system(size: 8, weight: .bold))
                              }
                              .foregroundColor(.white)
                          }
                          .contentShape(Circle())
                      }
                  }''')
              content = content.replace(old_struct_end, old_struct_end + call_button, 1)
              with open(path, 'w') as f:
                  f.write(content)
              print("OK Patch 4: added CallEntryButton next to 实时对话")
          print("All patches done (idempotent)")
          PYEOF

      - name: Remove YbridOpus.xcframework from project
        run: |
          # 删除 pbxproj 里所有 YbridOpus 引用（link phase / embed phase / file reference）
          for id in 9B2ECFF92EC898F90082B028 9B2ECFFA2EC898F90082B028 9B2ECFF82EC898F90082B028; do
            sed -i '' "/$id/d" xiaozhi.xcodeproj/project.pbxproj
          done
          if grep -q "YbridOpus" xiaozhi.xcodeproj/project.pbxproj; then
            echo "ERROR: YbridOpus still referenced in pbxproj"
            grep -n "YbridOpus" xiaozhi.xcodeproj/project.pbxproj
            exit 1
          fi
          echo "YbridOpus fully removed from pbxproj"

      - name: Generate shared scheme
        run: |
          mkdir -p xiaozhi.xcodeproj/xcshareddata/xcschemes
          TARGET_ID=$(grep -B1 'isa = PBXNativeTarget' xiaozhi.xcodeproj/project.pbxproj | head -1 | awk '{print $1}')
          echo "Target ID: $TARGET_ID"
          cat > xiaozhi.xcodeproj/xcshareddata/xcschemes/xiaozhi.xcscheme <<SCHEME_EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <Scheme LastUpgradeVersion="1600" version="1.7">
            <BuildAction parallelizeBuildables="YES" buildImplicitDependencies="YES">
              <BuildActionEntries>
                <BuildActionEntry buildForTesting="YES" buildForRunning="YES" buildForProfiling="YES" buildForArchiving="YES" buildForAnalyzing="YES">
                  <BuildableReference BuildableIdentifier="primary" BlueprintIdentifier="$TARGET_ID" BuildableName="xiaozhi.app" BlueprintName="xiaozhi" ReferencedContainer="container:xiaozhi.xcodeproj">
                  </BuildableReference>
                </BuildActionEntry>
              </BuildActionEntries>
            </BuildAction>
            <TestAction buildConfiguration="Debug" selectedDebuggerIdentifier="Xcode.DebuggerFoundation.Debugger.LLDB" selectedLauncherIdentifier="Xcode.DebuggerFoundation.Launcher.LLDB" shouldUseLaunchSchemeArgsEnv="YES">
              <Testables>
              </Testables>
            </TestAction>
            <LaunchAction buildConfiguration="Release" selectedDebuggerIdentifier="Xcode.DebuggerFoundation.Debugger.LLDB" selectedLauncherIdentifier="Xcode.DebuggerFoundation.Launcher.LLDB" launchStyle="0" useCustomWorkingDirectory="NO" ignoresPersistentStateOnLaunch="NO" debugDocumentVersioning="YES" debugServiceExtension="internal" allowLocationSimulation="YES">
            </LaunchAction>
            <ProfileAction buildConfiguration="Release" shouldUseLaunchSchemeArgsEnv="YES" savedToolIdentifier="" useCustomWorkingDirectory="NO" debugDocumentVersioning="YES">
            </ProfileAction>
            <AnalyzeAction buildConfiguration="Debug">
            </AnalyzeAction>
            <ArchiveAction buildConfiguration="Release" revealArchiveInOrganizer="YES">
            </ArchiveAction>
          </Scheme>
          SCHEME_EOF
          ls -la xiaozhi.xcodeproj/xcshareddata/xcschemes/

      - name: Set display name
        run: |
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName 小智" xiaozhi/Info.plist
          /usr/libexec/PlistBuddy -c "Print :CFBundleDisplayName" xiaozhi/Info.plist

      - name: Archive (unsigned, static opus)
        run: |
          xcodebuild -project xiaozhi.xcodeproj \
            -scheme xiaozhi \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/xiaozhi.xcarchive \
            PRODUCT_BUNDLE_IDENTIFIER=com.lu6618.xiaozhi \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            SWIFT_STRICT_CONCURRENCY=minimal \
            HEADER_SEARCH_PATHS='$(inherited) /tmp/opus-install/include' \
            LIBRARY_SEARCH_PATHS='$(inherited) /tmp/opus-install/lib' \
            OTHER_LDFLAGS='$(inherited) -lopus' \
            archive

      - name: Verify no embedded frameworks
        run: |
          APP_PATH=$(find build/xiaozhi.xcarchive/Products/Applications -maxdepth 1 -name "*.app" | head -1)
          echo "App: $APP_PATH"
          if [ -d "$APP_PATH/Frameworks" ]; then
            echo "WARNING: Frameworks dir exists:"
            ls -la "$APP_PATH/Frameworks/"
          else
            echo "OK: no Frameworks directory (all static)"
          fi
          ls -la "$APP_PATH" | head -20

      - name: Package unsigned IPA
        run: |
          APP_PATH=$(find build/xiaozhi.xcarchive/Products/Applications -maxdepth 1 -name "*.app" | head -1)
          rm -rf Payload && mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          rm -f xiaozhi-ios-unsigned.ipa
          zip -qr xiaozhi-ios-unsigned.ipa Payload
          ls -la xiaozhi-ios-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: xiaozhi-ios-unsigned
          path: xiaozhi-ios-unsigned.ipa
          if-no-files-found: error

      - name: Publish to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="unsigned-${{ github.run_number }}"
          gh release create "$TAG" \
            --title "Unsigned IPA #$TAG" \
            --notes "未签名 IPA，下载后自签安装。" \
            xiaozhi-ios-unsigned.ipa